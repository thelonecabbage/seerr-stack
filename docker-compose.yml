---
services:
  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    init: true
    container_name: seerr
    environment:
      - LOG_LEVEL=debug
      - TZ=${TZ:-Etc/UTC}
      - PORT=5055 #optional
    ports:
      - ${SEERR_PORT:-5055}:5055
    volumes:
      - ${SEERR_CONFIG:-/srv/seerr/config}:/app/config
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/settings/public || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3
    restart: unless-stopped
    
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Etc/UTC}
      - WEBUI_PORT=8081
      - TORRENTING_PORT=6881
    volumes:
      - ${MEDIA_CONFIG:-/srv/media-stack/config}/qbittorrent:/config
      - ${DOWNLOADS:-/srv/media-stack/downloads}:/downloads
      - ${MOVIES:-/srv/media-stack/media/movies}:/movies
      - ${TV:-/srv/media-stack/media/tv}:/tv
    ports:
      - ${QBITTORRENT_WEBUI_PORT:-8081}:8081
      - ${QBITTORRENT_TORRENTING_PORT:-6881}:6881
      - ${QBITTORRENT_TORRENTING_PORT:-6881}:6881/udp
    restart: unless-stopped

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Etc/UTC}
    volumes:
      - ${MEDIA_CONFIG:-/srv/media-stack/config}/prowlarr:/config
    ports:
      - ${PROWLARR_PORT:-9696}:9696
    restart: unless-stopped
    dns:
      - 1.1.1.1
      - 9.9.9.9
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Etc/UTC}
    volumes:
      - ${MEDIA_CONFIG:-/srv/media-stack/config}/sonarr:/config
      - ${MOVIES:-/srv/media-stack/media/movies}:/movies
      - ${TV:-/srv/media-stack/media/tv}:/tv
      - ${DOWNLOADS:-/srv/media-stack/downloads}:/downloads
    ports:
      - ${SONARR_PORT:-8989}:8989
    restart: unless-stopped
    
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Etc/UTC}
    volumes:
      - ${MEDIA_CONFIG:-/srv/media-stack/config}/radarr:/config
      - ${MOVIES:-/srv/media-stack/media/movies}:/movies
      - ${TV:-/srv/media-stack/media/tv}:/tv
      - ${DOWNLOADS:-/srv/media-stack/downloads}:/downloads
    ports:
      - ${RADARR_PORT:-7878}:7878
    restart: unless-stopped

  sabnzbd:
    image: lscr.io/linuxserver/sabnzbd:latest
    container_name: sabnzbd
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Etc/UTC}
    volumes:
      - ${MEDIA_CONFIG:-/srv/media-stack/config}/sabnzbd:/config
      - ${DOWNLOADS:-/srv/media-stack/downloads}:/downloads
    ports:
      - ${SABNZBD_HOST_PORT:-8082}:8080
    restart: unless-stopped
